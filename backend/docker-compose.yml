services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      CB_HOST: host.docker.internal
      CB_USER: ${CB_USER:-Administrator}
      CB_PASSWORD: ${CB_PASSWORD:?Set CB_PASSWORD in backend/.env}
      CB_BUCKET: ${CB_BUCKET:-ANI}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
